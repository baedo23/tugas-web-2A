<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 JavaScript</title>
</head>
<body>

    <h1>Tugas 3 JavaScript</h1>
    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        //penjumlahan
        let hasil = angka1 + angka2;
        document.write("Hasil Penjumlahan " + angka1 + " + " + angka2 + " = " + hasil + "<br>");

        //pengurangan
        hasil = angka1 - angka2;
        document.write("Hasil Pengurangan " + angka1 + " - " + angka2 + " = " + hasil + "<br>");

        //perkalian
        hasil = angka1 * angka2;    
        document.write("Hasil Perkalian " + angka1 + " * " + angka2 + " = " + hasil + "<br>");  
    
        //pembagian
        hasil = angka1 / angka2;
        document.write("Hasil Pembagian " + angka1 + " / " + angka2 + " = " + hasil + "<br>");

        //modulus
        hasil = angka1 % angka2;
        document.write("Hasil Modulus " + angka1 + " % " + angka2 + " = " + hasil + "<br>");

    </script>
</body>
</html>
