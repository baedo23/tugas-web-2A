<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
</head>
<body>
    <h1>Kalkulator </h1>
    <script type="text/javascript">
        let angka1 = prompt("Masukkan angka pertama : ");
        let angka2 = prompt("Masukkan angka kedua : ");

        let penjumlahan = parseFloat(angka1) + parseFloat(angka2);
        let pengurangan = parseFloat(angka1) - parseFloat(angka2);
        let perkalian = parseFloat(angka1) * parseFloat(angka2);
        let pembagian = parseFloat(angka1) / parseFloat(angka2);

        document.write("Hasil Penjumlahan: " + penjumlahan + "<br>");
        document.write("Hasil Pengurangan: " + pengurangan + "<br>");
        document.write("Hasil Perkalian: " + perkalian + "<br>");
        document.write("Hasil Pembagian: " + pembagian + "<br>");

    </script>
</body>
</html>
